<div class="t4e-doc-header-shell">
  <div class="t4e-doc-header-inner">
    <a
      class="t4e-doc-logo"
      href="#home"
      aria-label="Think4ever home"
      onclick="window.t4eDocHeaderClose && window.t4eDocHeaderClose()"
    >
      <img
        class="t4e-doc-logo-img"
        data-asset-src="assets/images/think4ever-logo.png"
        alt="Logo"
        onload="
          (function (img) {
            var root = img.closest('.t4e-doc-header-shell');
            if (!root || root.dataset.ready === 'true') return;
            root.dataset.ready = 'true';
            var header =
              root.closest('.modern-header') ||
              document.getElementById('consumerHeader');
            var button = root.querySelector('.t4e-doc-menu-toggle');
            var docs = root.querySelector('[data-submenu-trigger]');
            var submenu = root.querySelector('.t4e-doc-submenu');
            var links = root.querySelectorAll(
              '.t4e-doc-menu-link[data-section]',
            );
            var sectionIds = ['home', 'how-it-works', 'resources', 'contact'];
            function closeMenu() {
              root.classList.remove('is-open');
              if (header) header.classList.remove('is-open');
              button.setAttribute('aria-expanded', 'false');
              button.setAttribute('aria-label', 'Open menu');
              root.classList.remove('submenu-open');
              docs && docs.setAttribute('aria-expanded', 'false');
            }
            function openMenu() {
              root.classList.add('is-open');
              if (header) header.classList.add('is-open');
              button.setAttribute('aria-expanded', 'true');
              button.setAttribute('aria-label', 'Close menu');
            }
            window.t4eDocHeaderClose = closeMenu;
            button.addEventListener('click', function () {
              root.classList.contains('is-open') ? closeMenu() : openMenu();
            });
            docs &&
              docs.addEventListener('click', function (event) {
                event.preventDefault();
                var open = !root.classList.contains('submenu-open');
                root.classList.toggle('submenu-open', open);
                docs.setAttribute('aria-expanded', String(open));
              });
            submenu &&
              submenu.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', closeMenu);
              });
            root.querySelectorAll('[data-close-menu]').forEach(function (link) {
              link.addEventListener('click', closeMenu);
            });
            window.addEventListener(
              'scroll',
              function () {
                if (header)
                  header.classList.toggle(
                    'is-scrolled',
                    (window.scrollY || window.pageYOffset) > 40,
                  );
              },
              { passive: true },
            );
            if (header)
              header.classList.toggle(
                'is-scrolled',
                (window.scrollY || window.pageYOffset) > 40,
              );
            function setActive(id) {
              links.forEach(function (link) {
                link.classList.toggle('is-active', link.dataset.section === id);
              });
            }
            if ('IntersectionObserver' in window) {
              var observer = new IntersectionObserver(
                function (entries) {
                  entries.forEach(function (entry) {
                    if (entry.isIntersecting && entry.target.id)
                      setActive(entry.target.id);
                  });
                },
                { root: null, rootMargin: '-40% 0px -40% 0px', threshold: 0 },
              );
              sectionIds.forEach(function (id) {
                var section = document.getElementById(id);
                if (section) observer.observe(section);
              });
            }
            setActive('home');
          })(this)
        "
      />
    </a>

    <div class="t4e-doc-header-right">
      <a class="t4e-doc-cta" href="#contact" data-close-menu> Get Started </a>

      <button
        class="t4e-doc-menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div class="t4e-doc-menu" aria-label="Main navigation">
    <nav class="t4e-doc-menu-list">
      <a
        class="t4e-doc-menu-link"
        href="#home"
        data-section="home"
        data-close-menu
      >
        <span class="t4e-doc-menu-line"></span>
        <span>Home</span>
      </a>
      <a
        class="t4e-doc-menu-link"
        href="#how-it-works"
        data-section="how-it-works"
        data-close-menu
      >
        <span class="t4e-doc-menu-line"></span>
        <span>How it Works</span>
      </a>
      <a
        class="t4e-doc-menu-link t4e-doc-menu-link-button"
        href="#"
        data-submenu-trigger
        aria-expanded="false"
      >
        <span class="t4e-doc-menu-line"></span>
        <span>Docs</span>
        <svg
          class="t4e-doc-chevron"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </a>

      <div class="t4e-doc-submenu">
        <div class="t4e-doc-submenu-inner">
          <a
            class="t4e-doc-submenu-link"
            href="https://think4ever.com/docs/onboarding.html"
          >
            <span class="t4e-doc-menu-line"></span>
            <span>Customer Onboarding</span>
          </a>
          <a
            class="t4e-doc-submenu-link"
            href="https://think4ever.com/docs/manual_introduction.html"
          >
            <span class="t4e-doc-menu-line"></span>
            <span>Designer</span>
          </a>
          <a
            class="t4e-doc-submenu-link"
            href="https://think4ever.com/docs/dev/start_new_project.html"
          >
            <span class="t4e-doc-menu-line"></span>
            <span>Developer</span>
          </a>
          <a
            class="t4e-doc-submenu-link"
            href="https://think4ever.com/docs/portal/dashboard.html"
          >
            <span class="t4e-doc-menu-line"></span>
            <span>Portal</span>
          </a>
          <a
            class="t4e-doc-submenu-link"
            href="https://think4ever.com/docs/reverse_engineering.html"
          >
            <span class="t4e-doc-menu-line"></span>
            <span>Reverse Engineering</span>
          </a>
        </div>
      </div>

      <a
        class="t4e-doc-menu-link"
        href="#resources"
        data-section="resources"
        data-close-menu
      >
        <span class="t4e-doc-menu-line"></span>
        <span>Resources</span>
      </a>
      <a
        class="t4e-doc-menu-link"
        href="#contact"
        data-section="contact"
        data-close-menu
      >
        <span class="t4e-doc-menu-line"></span>
        <span>Contact Us</span>
      </a>
    </nav>
  </div>

  <div
    class="theme-toggle-slot"
    id="docThemeToggleMount"
    style="display: none"
  ></div>

  <style>
    #consumerHeader.modern-header {
      align-items: stretch;
      border-bottom: 0;
      background: transparent;
      box-shadow: none;
      height: 80px;
      overflow: hidden;
      padding: 20px 0;
      transition:
        height 500ms cubic-bezier(0.16, 1, 0.3, 1),
        padding 500ms cubic-bezier(0.16, 1, 0.3, 1),
        background-color 500ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 500ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
    }

    #consumerHeader.modern-header.is-scrolled {
      height: 72px;
      padding: 10px 0;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 1px 24px rgba(0, 0, 0, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #consumerHeader.modern-header.is-open {
      height: 100dvh;
      padding: 20px 0;
      background: #ffffff;
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
    }

    .t4e-doc-header-shell {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      width: 100%;
      min-width: 0;
    }

    .t4e-doc-header-inner,
    .t4e-doc-menu {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .t4e-doc-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
    }

    .t4e-doc-logo {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      text-decoration: none;
    }

    .t4e-doc-logo-img {
      display: block;
      width: 120px;
      height: auto;
      object-fit: contain;
      border-radius: 0;
    }

    .t4e-doc-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .t4e-doc-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 22px;
      border-radius: 8px;
      background: #e25d24;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 16px 30px rgba(102, 124, 246, 0.26);
      transition:
        transform 200ms ease,
        box-shadow 200ms ease,
        filter 200ms ease;
    }

    .t4e-doc-cta:hover {
      filter: brightness(0.97);
      transform: translateY(-1px);
      box-shadow: 0 20px 36px rgba(102, 124, 246, 0.32);
    }

    .t4e-doc-menu-toggle {
      position: relative;
      z-index: 55;
      display: flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      border: 1px solid #e4e4e7;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      cursor: pointer;
      transition:
        background-color 300ms ease,
        border-color 300ms ease;
    }

    .t4e-doc-menu-toggle:hover {
      background: #fafafa;
    }

    .t4e-doc-menu-toggle span {
      width: 16px;
      height: 2px;
      border-radius: 9999px;
      background: #27272a;
      transition:
        opacity 300ms ease,
        transform 300ms ease;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-toggle span:nth-child(1) {
      transform: rotate(45deg) translateY(7px);
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-toggle span:nth-child(2) {
      opacity: 0;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-toggle span:nth-child(3) {
      transform: rotate(-45deg) translateY(-7px);
    }

    .t4e-doc-menu {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 80px;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      scrollbar-width: none;
      transition: opacity 200ms ease;
    }

    .t4e-doc-menu::-webkit-scrollbar {
      display: none;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 300ms ease 200ms;
    }

    .t4e-doc-menu-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
      width: 100%;
      margin-top: 48px;
    }

    .t4e-doc-menu-link,
    .t4e-doc-submenu-link {
      display: inline-flex;
      align-items: center;
      width: 100%;
      color: #09090b;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 0;
      opacity: 0;
      transform: translateX(-24px);
      transition:
        color 300ms ease,
        opacity 380ms ease-out,
        transform 380ms ease-out;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link {
      opacity: 1;
      transform: translateX(0);
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link:nth-of-type(1) {
      transition-delay: 200ms;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link:nth-of-type(2) {
      transition-delay: 280ms;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link:nth-of-type(3) {
      transition-delay: 360ms;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link:nth-of-type(4) {
      transition-delay: 440ms;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link:nth-of-type(5) {
      transition-delay: 520ms;
    }

    .t4e-doc-menu-link:hover,
    .t4e-doc-submenu-link:hover {
      color: #093cad;
    }

    .t4e-doc-menu-link.is-active {
      background: linear-gradient(90deg, #07a7e1, #093cad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .t4e-doc-menu-line {
      width: 0;
      height: 3px;
      flex: 0 0 auto;
      margin-right: 0;
      border-radius: 9999px;
      background: linear-gradient(90deg, #07a7e1, #093cad);
      opacity: 0;
      transition:
        width 300ms ease,
        margin-right 300ms ease,
        opacity 300ms ease;
    }

    .t4e-doc-menu-link:hover .t4e-doc-menu-line,
    .t4e-doc-submenu-link:hover .t4e-doc-menu-line,
    .t4e-doc-menu-link.is-active .t4e-doc-menu-line {
      width: 24px;
      margin-right: 16px;
      opacity: 1;
    }

    .t4e-doc-chevron {
      margin-left: 16px;
      color: #a1a1aa;
      transition:
        color 300ms ease,
        transform 300ms ease;
    }

    .t4e-doc-menu-link:hover .t4e-doc-chevron,
    .t4e-doc-header-shell.submenu-open .t4e-doc-chevron {
      color: #093cad;
    }

    .t4e-doc-header-shell.submenu-open .t4e-doc-chevron {
      transform: rotate(180deg);
    }

    .t4e-doc-submenu {
      max-height: 0;
      width: 100%;
      overflow: hidden;
      opacity: 0;
      transition:
        max-height 300ms ease-in-out,
        opacity 300ms ease-in-out;
    }

    .t4e-doc-header-shell.submenu-open .t4e-doc-submenu {
      max-height: 280px;
      opacity: 1;
    }

    .t4e-doc-submenu-inner {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 0 8px 32px;
    }

    .t4e-doc-submenu-link {
      font-size: 20px;
    }

    .t4e-doc-submenu-link .t4e-doc-menu-line {
      height: 3px;
    }

    .t4e-doc-submenu-link:hover .t4e-doc-menu-line {
      width: 20px;
    }

    body.dark #consumerHeader.modern-header.is-scrolled,
    body.dark #consumerHeader.modern-header.is-open {
      background: #ffffff;
    }

    @media (min-width: 768px) {
      .t4e-doc-header-inner,
      .t4e-doc-menu {
        padding-left: 48px;
        padding-right: 48px;
      }

      .t4e-doc-logo-img {
        width: 150px;
      }

      .t4e-doc-menu-list {
        gap: 28px;
        margin-top: 0;
      }

      .t4e-doc-menu-link {
        font-size: 30px;
      }

      .t4e-doc-submenu-link {
        font-size: 24px;
      }

      .t4e-doc-menu-line,
      .t4e-doc-menu-link:hover .t4e-doc-menu-line,
      .t4e-doc-menu-link.is-active .t4e-doc-menu-line {
        height: 4px;
      }

      .t4e-doc-menu-link:hover .t4e-doc-menu-line,
      .t4e-doc-menu-link.is-active .t4e-doc-menu-line {
        width: 32px;
      }

      .t4e-doc-submenu-inner {
        padding-left: 48px;
      }

      .t4e-doc-submenu-link .t4e-doc-menu-line {
        height: 4px;
      }

      .t4e-doc-submenu-link:hover .t4e-doc-menu-line {
        width: 24px;
      }
    }

    @media (min-width: 1024px) {
      .t4e-doc-menu-link {
        font-size: 36px;
      }

      .t4e-doc-submenu-link {
        font-size: 30px;
      }
    }

    .t4e-doc-header-shell.is-open .t4e-doc-submenu-link {
      opacity: 1;
    }
  </style>
</div>
