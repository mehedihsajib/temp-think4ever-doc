  <style>
    #consumerHeader.modern-header {
      align-items: stretch;
      border-bottom: 0;
      background: transparent;
      box-shadow: none;
      height: 80px;
      overflow: hidden;
      padding: 20px 0;
      transition:
        height 500ms cubic-bezier(0.16, 1, 0.3, 1),
        padding 500ms cubic-bezier(0.16, 1, 0.3, 1),
        background-color 500ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 500ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
    }

    #consumerHeader.modern-header.is-scrolled {
      height: 72px;
      padding: 10px 0;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 1px 24px rgba(0, 0, 0, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #consumerHeader.modern-header.is-open {
      height: 100dvh;
      padding: 20px 0;
      background: #ffffff;
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
    }

    .t4e-doc-header-shell {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      width: 100%;
      min-width: 0;
    }

    .t4e-doc-header-inner,
    .t4e-doc-menu {
      width: 100%;
      max-width: 1430px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .t4e-doc-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
    }

    .t4e-doc-logo {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      text-decoration: none;
    }

    .t4e-doc-logo-img {
      display: block;
      width: 120px;
      height: auto;
      object-fit: contain;
      border-radius: 0;
    }

    .t4e-doc-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .t4e-doc-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 22px;
      border-radius: 100px;
      background: linear-gradient(to right, #07a7e1 0%, #093cad 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition:
        transform 200ms ease,
        box-shadow 200ms ease,
        filter 200ms ease;
    }

    .t4e-doc-cta:hover {
      filter: brightness(0.97);
      transform: translateY(-1px);
    }

    .t4e-doc-menu-toggle {
      position: relative;
      z-index: 55;
      display: flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      border: 1px solid #e4e4e7;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      cursor: pointer;
      transition:
        background-color 300ms ease,
        border-color 300ms ease;
    }

    .t4e-doc-menu-toggle:hover {
      background: #fafafa;
    }

    .t4e-doc-menu-toggle span {
      width: 16px;
      height: 2px;
      border-radius: 9999px;
      background: #27272a;
      transition:
        opacity 300ms ease,
        transform 300ms ease;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-toggle span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-toggle span:nth-child(2) {
      opacity: 0;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-toggle span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .t4e-doc-menu {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 80px;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      scrollbar-width: none;
      transition: opacity 200ms ease;
    }

    .t4e-doc-menu::-webkit-scrollbar {
      display: none;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 300ms ease 200ms;
    }

    .t4e-doc-menu-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
      width: 100%;
      margin-top: 48px;

      display: inline-flex;
      align-items: center;
      width: 100%;
      color: #09090b;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 0;
      opacity: 0;
      transform: translateX(-24px);
      transition:
        color 300ms ease,
        opacity 380ms ease-out,
        transform 380ms ease-out;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link {
      opacity: 1;
      transform: translateX(0);
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link:nth-of-type(1) {
      transition-delay: 200ms;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link:nth-of-type(2) {
      transition-delay: 280ms;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link:nth-of-type(3) {
      transition-delay: 360ms;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link:nth-of-type(4) {
      transition-delay: 440ms;
    }

    .t4e-doc-header-shell.is-open .t4e-doc-menu-link:nth-of-type(5) {
      transition-delay: 520ms;
    }

    .t4e-doc-menu-link:hover,
    .t4e-doc-submenu-link:hover {
      color: #093cad;
    }

    .t4e-doc-menu-link.is-active {
      background: linear-gradient(90deg, #07a7e1, #093cad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .t4e-doc-menu-line {
      width: 0;
      height: 3px;
      flex: 0 0 auto;
      margin-right: 0;
      border-radius: 9999px;
      background: linear-gradient(90deg, #07a7e1, #093cad);
      opacity: 0;
      transition:

        margin-right 300ms ease,

    }

    .t4e-doc-menu-link:hover .t4e-doc-menu-line,
    .t4e-doc-submenu-link:hover .t4e-doc-menu-line,

    }

    .t4e-doc-chevron {

        transform 300ms ease;
    }

    .t4e-doc-menu-link:hover .t4e-doc-chevron,
    .t4e-doc-header-shell.submenu-open .t4e-doc-chevron {
      color: #093cad;
    }

    }

    .t4e-doc-submenu {
      max-height: 0;
      width: 100%;
      overflow: hidden;
      opacity: 0;
      transition:
        max-height 300ms ease-in-out,
        opacity 300ms ease-in-out;

    .t4e-doc-header-shell.submenu-open .t4e-doc-submenu {
